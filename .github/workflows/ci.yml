name: CI

on:
  push:
    branches:
      - main
      - integration/ai-task-hub-foundation
      - feature/document-parser-artifact-d2
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: ./gradlew clean test build bootJar --no-daemon

  backend-postgresql:
    name: PostgreSQL 17.10 / Flyway V27
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: ./gradlew clean postgresTest --no-daemon --console=plain
      - name: Upload PostgreSQL test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-test-results
          path: backend/build/test-results/postgresTest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontEnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontEnd/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:baseline
      - name: Build frontend
        if: always()
        run: npm run build

  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: >-
          docker compose
          --env-file .env.e2e.example
          -f compose.yaml
          -f compose.e2e.yaml
          config --quiet
      - name: Run full Docker E2E
        shell: pwsh
        run: >-
          ./scripts/docker-e2e-smoke.ps1
          -EnvFile .env.e2e.example

  contract-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements-dev.txt
      - run: pip install -r ai/requirements-dev.txt
      - run: python -m pytest ai/tests -q
      - run: python docs/contracts/fixtures/internal-ai-v1/validate_fixtures.py
      - run: npx --yes @redocly/cli@2.20.5 lint docs/api/openapi.yaml
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
